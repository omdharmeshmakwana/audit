<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Faible</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 12px; color: #111; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .tag { font-size: 11px; background: #fde68a; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; }
      dt { color: #666; }
      dd { margin: 0; word-break: break-all; }
      .err { color: #b91c1c; }
      button { margin: 4px 4px 0 0; }
      ul { margin: 4px 0; padding-left: 16px; max-height: 120px; overflow: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Faible <span class="tag">Phase 0 · capture-all</span></h1>
    <label><input type="checkbox" id="enabled" /> Capture all traffic on Higgsfield / Magnific</label>
    <dl>
      <dt>Captured</dt><dd id="captured">–</dd>
      <dt>Sent</dt><dd id="sent">–</dd>
      <dt>Queued</dt><dd id="queued">–</dd>
      <dt>Dropped</dt><dd id="dropped">–</dd>
      <dt>Last sent</dt><dd id="lastSent">–</dd>
      <dt>Error</dt><dd id="error" class="err">–</dd>
    </dl>
    <div><b>Recent actions</b> (submits, cancels, downloads):</div>
    <ul id="actions"><li>none yet</li></ul>
    <div>Hosts seen:</div>
    <ul id="hosts"></ul>
    <button id="flush">Flush now</button>
    <button id="clear">Clear</button>
    <script src="popup.js"></script>
  </body>
</html>
