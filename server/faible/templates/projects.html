{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block main %}
<h1>Projects</h1>
<table>
  <tr><th>Code</th><th>Name</th><th>Status</th></tr>
  {% for p in projects %}
  <tr><td><a href="/projects/{{ p.id }}">{{ p.code }}</a></td><td>{{ p.name }}</td><td>{{ p.status }}</td></tr>
  {% else %}
  <tr><td colspan="3" class="muted">No projects yet.</td></tr>
  {% endfor %}
</table>
{% if user.role in ['admin', 'director'] %}
<h2>New project</h2>
<form method="post" action="/projects" class="inline">
  <label>Code <input name="code" required placeholder="PROJ01" pattern="[A-Za-z0-9_ -]+"></label>
  <label>Name <input name="name" placeholder="Project name"></label>
  <button>Create project</button>
</form>
{% endif %}
{% endblock %}
